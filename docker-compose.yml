services:
  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - LANG= C.UTF-8
      - LC_ALL= C.UTF-8 #이거 해줘야 db 한글 인코딩 됨 씨발
    ports:
      - 3307:3306
    volumes:
      - PIGO_volume:/var/lib/mysql
      - ./src/config/db_init.sql:/docker-entrypoint-initdb.d/db_init.sql


  mainserver:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - 8080:8080
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    develop: #컨테이너 띄우고 저장하면 실시간으로 반영해주는거
      watch:
        - action: sync
          path: . #어떤 파일 감시할건지 ㅇㅇ 폴더 경로
          target: /app
        - action: rebuild
          path: package.json 


volumes:
  PIGO_volume:
#     #external: true
#     #개발 중에는 내부 볼륨이 편할듯 ㅇㅇ..